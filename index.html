<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Almost There</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root{--red:#ff2a22;--white:#f5f7ff}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#09152f;color:var(--white);font-family:Arial,Helvetica,sans-serif}body{cursor:crosshair}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:2;inset:0;padding:22px 25px;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none;transition:opacity 1.2s}
.bottomline{display:flex;justify-content:space-between;gap:16px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#d4e2ff}
.progress-panel{position:absolute;top:25px;left:50%;transform:translateX(-50%);width:min(280px,45vw)}
.progress-copy{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
#percent{font-size:12px;font-variant-numeric:tabular-nums}
.progress-track{height:2px;background:rgba(255,255,255,.25);overflow:hidden}
.progress-fill{width:12%;height:100%;background:var(--red);box-shadow:0 0 12px rgba(255,42,34,.7);transition:width .3s}
#fuelLabel{color:#fff}#tapCount{font-variant-numeric:tabular-nums}
#tapZone{position:fixed;z-index:4;left:50%;bottom:8.5%;transform:translate(-50%,0);width:88px;height:88px;border:0;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#tapZone:hover{filter:drop-shadow(0 0 14px rgba(255,255,255,.45))}
#tapZone svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tap-ring{position:absolute;inset:-8px;border:1px solid rgba(255,255,255,.25);border-radius:50%;animation:pulse 1.8s ease-out infinite;pointer-events:none}
.tap-label{position:absolute;z-index:2;font-size:10px;font-weight:800;letter-spacing:.2em;text-shadow:0 1px 6px rgba(7,19,44,.8);pointer-events:none}
#flock{position:fixed;z-index:4;left:50%;bottom:8.5%;transform:translateX(-50%)}
#flockIn{display:flex;gap:18px;align-items:center}.pl{position:relative;width:80px;height:80px;padding:0;border:0;background:transparent;color:#fff;display:grid;place-items:center;transition:opacity .3s}.pl>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 6px rgba(255,255,255,.35))}button.pl{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button.pl:hover{filter:drop-shadow(0 0 14px rgba(255,255,255,.45))}
.screen{position:fixed;z-index:5;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,#77a9ee 0%,#b8d5ff 48%,#07132c 100%)}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 44%,rgba(255,255,255,.55),rgba(173,211,255,.12) 32%,transparent 68%);pointer-events:none}
.maker{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px}
#preview{width:128px;height:128px}#preview svg,.pick svg,.belief svg{width:100%;height:100%;overflow:visible}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:90vw}
.pick{width:46px;height:46px;padding:7px;border:1px solid rgba(255,255,255,.35);border-radius:50%;background:rgba(7,19,44,.28);cursor:pointer;transition:transform .2s,border-color .2s}
.pick.on{border-color:#fff;transform:scale(1.15)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.4);cursor:pointer;transition:transform .2s}.sw.on{border-color:#fff;transform:scale(1.25)}
#go{width:54px;height:54px;border-radius:50%;border:1px solid #fff;background:rgba(7,19,44,.35);color:#fff;font-size:22px;cursor:pointer;transition:transform .2s}#go:hover{transform:scale(1.1)}
.field{position:relative;width:min(760px,90vw);height:min(540px,78vh);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);place-items:center;gap:20px}
.belief{width:clamp(72px,13vw,130px);aspect-ratio:1;border:0;padding:10px;background:transparent;cursor:pointer;transition:transform .2s,filter .2s}
.belief:hover{transform:scale(1.12);filter:drop-shadow(0 0 16px rgba(255,255,255,.45))}.belief:active{transform:scale(.94)}
.hidden{display:none!important}.slot{width:44px;height:44px;padding:6px;border-radius:50%;border:1px dashed rgba(255,255,255,.4);transition:opacity .4s,border-color .4s}.slot svg{width:100%;height:100%;overflow:visible}.slot.on{border:1px solid rgba(255,255,255,.55);opacity:.45}.slot.rdy{opacity:1;border-color:#fff}.slot.me{box-shadow:0 0 0 3px rgba(255,255,255,.28)}#go:disabled{opacity:.5;cursor:default}.pick:disabled,.sw:disabled{cursor:default}
.pl.wait{opacity:.5;animation:wait 1.2s ease-in-out infinite}@keyframes wait{50%{opacity:.9}}
#tapWarning{position:fixed;z-index:8;left:50%;bottom:calc(8.5% + 112px);transform:translate(-50%,8px);width:max-content;max-width:88vw;color:#fff0ee;font-size:clamp(11px,1.5vw,15px);font-weight:700;letter-spacing:.12em;text-align:center;opacity:0;pointer-events:none;text-shadow:0 1px 12px rgba(0,0,0,.45);transition:opacity .25s,transform .25s}
#tapWarning.show{opacity:1;transform:translate(-50%,0)}
@keyframes pulse{0%{transform:scale(.85);opacity:.8}100%{transform:scale(1.4);opacity:0}}
@media(max-width:600px){.hud{padding:16px}.progress-panel{top:55px;width:min(250px,70vw)}.bottomline{font-size:8px}#tapZone{bottom:10%;width:68px;height:68px}#flock{bottom:10%}#flockIn{gap:10px}.pl{width:58px;height:58px}#tapWarning{bottom:calc(10% + 88px);font-size:10px}.field{height:70vh;gap:8px}.belief{width:clamp(68px,19vw,108px)}}
</style>
</head>
<body>
<canvas id="scene" aria-label="An endless geometric road"></canvas>
<div class="screen" id="createScreen"><div class="glow"></div>
  <div class="maker"><div class="row" id="slots"></div><div id="preview"></div><div class="row" id="shapeRow"></div><div class="row" id="colorRow"></div><button id="go" aria-label="Confirm">&rarr;</button></div>
</div>
<main class="hud" id="hud" hidden>
  <section class="progress-panel" aria-live="polite"><div class="progress-copy"><span id="message">YOUR FUTURE</span><span id="percent">12.0%</span></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></section>
  <div class="bottomline"><span id="fuelLabel">TAP TO MOVE FORWARD!</span><span id="tapCount">TAPS 000</span></div>
</main>
<div id="flock" hidden><div id="flockIn"></div></div>
<div id="tapWarning" role="status" aria-live="polite">YOU CANNOT GET CLOSER TO THIS SUN.</div>
<script src="script.js"></script>
</body>
</html>
